<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLY Point Cloud Processor</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/PLYLoader.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap');
  :root {
    --bg: #0a0c10; --panel: #111318; --border: #1e2230; --accent: #00e5ff;
    --accent2: #ff6b35; --accent3: #7c3aed; --text: #e2e8f0; --muted: #64748b;
    --success: #10b981; --canvas-bg: #080a0e;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Space Mono', monospace; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  #topbar { display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--border); flex-shrink: 0; flex-wrap: wrap; z-index: 100; }
  #topbar .logo { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 16px; color: var(--accent); letter-spacing: 2px; margin-right: 12px; }
  .tb-sep { width: 1px; height: 24px; background: var(--border); margin: 0 4px; }
  .btn { padding: 6px 14px; border: 1px solid var(--border); background: #161922; color: var(--text); font-family: 'Space Mono', monospace; font-size: 12px; font-weight: bold; cursor: pointer; border-radius: 4px; transition: all .15s; }
  .btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(0,229,255,.15); }
  .btn.primary { border-color: var(--accent); color: #000; background: var(--accent); }
  .btn.primary:hover { background: #33ebff; }
  .btn.active { border-color: var(--accent); color: var(--accent); background: rgba(0,229,255,.1); }
  #main { display: flex; flex: 1; position: relative; overflow: hidden; }
  #sidebar { width: 240px; min-width: 240px; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 16px; gap: 16px; overflow-y: auto; z-index: 90; }
  .section-title { font-size: 10px; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; margin-bottom: 6px; }
  .info-row { display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 4px; }
  .info-row .label { color: var(--muted); }
  .info-row .value { color: var(--accent); font-weight: bold; }
  .slider-row { margin-bottom: 8px; }
  .slider-row label { font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; margin-bottom: 4px; }
  input[type=range] { width: 100%; height: 5px; accent-color: var(--accent); }
  #canvas-container { flex: 1; width: 100%; height: 100%; position: relative; background: #080a0e; }
  #overlay-msg { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; pointer-events: none; z-index: 10; }
  #overlay-msg h3 { font-family: 'Syne', sans-serif; font-size: 18px; color: var(--muted); }
</style>
</head>
<body>
<div id="topbar">
  <div class="logo">PLY·FORGE 3D</div>
  <div class="tb-sep"></div>
  <button class="btn primary" onclick="document.getElementById('fileInput').click()">📂 Import .PLY File</button>
  <input type="file" id="fileInput" accept=".ply" style="display:none" onchange="loadUserPLY(this)">
  <button class="btn" onclick="loadDemoModel()">✨ Load Demo 3D Scan</button>
  <div class="tb-sep"></div>
  <button class="btn" onclick="resetCamera()">🎯 Reset Camera</button>
  <div class="tb-sep"></div>
  <span style="font-size: 11px; color: var(--muted); margin-left: auto;">🖱️ Left Click: Rotate | Right Click: Pan | Scroll: Zoom</span>
</div>

<div id="main">
  <div id="sidebar">
    <div>
      <div class="section-title">3D Model Info</div>
      <div class="info-row"><span class="label">Points Count:</span><span class="value" id="info-pts">0</span></div>
      <div class="info-row"><span class="label">Model Status:</span><span class="value" id="info-status">Waiting for load</span></div>
    </div>
    <hr style="border-color: var(--border);">
    <div>
      <div class="section-title">Point Display Settings</div>
      <div class="slider-row">
        <label>Point Size: <span id="sz-val">3</span></label>
        <input type="range" id="szSlider" min="1" max="15" value="3" oninput="updatePointSize(this.value)">
      </div>
    </div>
    <hr style="border-color: var(--border);">
    <div>
      <div class="section-title">Presets & Shapes</div>
      <button class="btn" style="width:100%; margin-bottom: 8px;" onclick="loadRoomPreset()">🏠 Load 3D Room Scan</button>
      <button class="btn" style="width:100%;" onclick="loadSpherePreset()">🌐 Load 3D Sphere Scan</button>
    </div>
  </div>

  <div id="canvas-container">
    <div id="overlay-msg">
      <div style="font-size: 40px;">☁️</div>
      <h3>No Point Cloud Loaded</h3>
      <p style="color: #64748b; font-size: 12px;">Click "Load Demo 3D Scan" above or import your own .ply file</p>
    </div>
  </div>
</div>

<script>
let scene, camera, renderer, controls, pointCloud = null;
const container = document.getElementById('canvas-container');

function initThree() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x080a0e);

  const gridHelper = new THREE.GridHelper(20, 20, 0x00e5ff, 0x1e2230);
  gridHelper.position.y = -2;
  scene.add(gridHelper);

  const axesHelper = new THREE.AxesHelper(3);
  scene.add(axesHelper);

  camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
  camera.position.set(0, 4, 10);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(container.clientWidth, container.clientHeight);
  renderer.setPixelRatio(window.devicePixelRatio);
  container.appendChild(renderer.domElement);

  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;

  window.addEventListener('resize', onWindowResize);
  animate();
}

function onWindowResize() {
  camera.aspect = container.clientWidth / container.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(container.clientWidth, container.clientHeight);
}

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

function displayGeometry(geometry, name) {
  if (pointCloud) scene.remove(pointCloud);

  const count = geometry.attributes.position.count;
  document.getElementById('info-pts').textContent = count.toLocaleString();
  document.getElementById('info-status').textContent = name;
  document.getElementById('overlay-msg').style.display = 'none';

  // If no colors, apply height gradient
  if (!geometry.attributes.color) {
    const positions = geometry.attributes.position.array;
    const colors = [];
    for (let i = 0; i < positions.length; i += 3) {
      const y = positions[i + 1];
      const color = new THREE.Color();
      color.setHSL((y + 2) / 6, 0.9, 0.55);
      colors.push(color.r, color.g, color.b);
    }
    geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  }

  const pSize = parseFloat(document.getElementById('szSlider').value);
  const material = new THREE.PointsMaterial({
    size: pSize * 0.05,
    vertexColors: true,
    sizeAttenuation: true
  });

  pointCloud = new THREE.Points(geometry, material);
  scene.add(pointCloud);

  geometry.computeBoundingSphere();
  const sphere = geometry.boundingSphere;
  controls.target.copy(sphere.center);
  camera.position.set(sphere.center.x, sphere.center.y + sphere.radius, sphere.center.z + sphere.radius * 2.5);
  controls.update();
}

function loadUserPLY(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function (e) {
    const loader = new THREE.PLYLoader();
    const geometry = loader.parse(e.target.result);
    displayGeometry(geometry, file.name);
  };
  reader.readAsArrayBuffer(file);
}

function loadRoomPreset() {
  const points = [];
  // Generate a room with walls, floor and a table in the center
  for (let x = -5; x <= 5; x += 0.2) {
    for (let z = -5; z <= 5; z += 0.2) {
      points.push(x, -2, z); // Floor
      if (Math.abs(x) > 4.8 || Math.abs(z) > 4.8) {
        for (let y = -2; y <= 3; y += 0.3) {
          points.push(x, y, z); // Walls
        }
      }
      // Table in the middle
      if (Math.abs(x) < 1.5 && Math.abs(z) < 1.5) {
        points.push(x, 0.5, z);
      }
    }
  }
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(points, 3));
  displayGeometry(geometry, 'Room 3D Scan');
}

function loadSpherePreset() {
  const geometry = new THREE.SphereGeometry(3, 48, 48);
  displayGeometry(geometry, '3D Sphere');
}

function loadDemoModel() {
  loadRoomPreset();
}

function updatePointSize(val) {
  document.getElementById('sz-val').textContent = val;
  if (pointCloud) {
    pointCloud.material.size = parseFloat(val) * 0.05;
  }
}

function resetCamera() {
  if (pointCloud) {
    pointCloud.geometry.computeBoundingSphere();
    const sphere = pointCloud.geometry.boundingSphere;
    controls.target.copy(sphere.center);
    camera.position.set(sphere.center.x, sphere.center.y + sphere.radius, sphere.center.z + sphere.radius * 2.5);
    controls.update();
  } else {
    camera.position.set(0, 4, 10);
    controls.target.set(0, 0, 0);
    controls.update();
  }
}

initThree();
</script>
</body>
</html>
